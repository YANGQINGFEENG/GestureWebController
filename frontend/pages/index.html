<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GestureWebController · 演示</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #131a2e;
        --panel-2: #1a2340;
        --line: #26304d;
        --text: #e6e9f2;
        --muted: #93a0bd;
        --accent: #4f8cff;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #16203c 0%, var(--bg) 60%);
        color: var(--text);
        font: 14px/1.6 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        min-height: 100vh;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 18px 24px; border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 10;
        background: rgba(11, 16, 32, 0.86); backdrop-filter: blur(8px);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: 0.2px; }
      .pill {
        font-size: 12px; padding: 2px 10px; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
      }
      .pill.ok { color: #b7f7c9; border-color: #1f5f36; background: #0f2a1c; }
      .pill.err { color: #ffd0d0; border-color: #6b2020; background: #2a1212; }
      main {
        display: grid; grid-template-columns: minmax(380px, 1fr) minmax(320px, 420px);
        gap: 20px; padding: 20px 24px 60px; align-items: start;
      }
      @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); overflow: hidden;
      }
      .card > h2 {
        font-size: 13px; margin: 0; padding: 12px 16px; color: var(--muted);
        border-bottom: 1px solid var(--line); font-weight: 600; letter-spacing: 0.4px;
      }
      .stage { position: relative; background: #0a0f1e; }
      #preview { display: block; width: 100%; aspect-ratio: 4 / 3; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
      button {
        font: inherit; color: var(--text); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer;
        transition: 0.15s;
      }
      button:hover:not(:disabled) { border-color: #3d4a72; background: #202b4d; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #06122b; font-weight: 600; }
      button.danger { border-color: #5b2222; color: #ffb4b4; }
      .field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .field input[type="text"] {
        font: inherit; font-size: 12px; color: var(--text); background: #0d1425;
        border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 190px;
      }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); }
      .stats div { background: var(--panel); padding: 10px 12px; }
      .stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
      .stats span { font-size: 11px; color: var(--muted); }
      .gestures { display: grid; gap: 1px; background: var(--line); }
      .gesture {
        display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px;
        background: var(--panel); padding: 9px 14px;
      }
      .gesture.active { background: #16244a; }
      .gesture .emoji { font-size: 20px; text-align: center; }
      .gesture .name { font-weight: 600; }
      .gesture .meta { font-size: 11px; color: var(--muted); }
      .gesture .act { font-size: 11px; color: #cfe0ff; background: #1c2a4d; border-radius: 999px; padding: 2px 9px; }
      #log { height: 260px; overflow-y: auto; padding: 10px 14px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      #log div { padding: 2px 0; border-bottom: 1px dashed rgba(38, 48, 77, 0.5); color: #b9c4dd; }
      #log .t { color: #5f6d8f; margin-right: 8px; }
      #log .hit { color: #b7f7c9; }
      #log .fire { color: #ffe08a; font-weight: 600; }
      #log .err { color: #ffb4b4; }
      .hint { padding: 10px 16px; font-size: 12px; color: var(--warn); border-top: 1px solid var(--line); }
      .hint:empty { display: none; }
      .article { padding: 18px 22px; max-height: 420px; overflow: auto; }
      .article h3 { margin: 18px 0 6px; font-size: 14px; }
      .article p { margin: 8px 0; color: #c3cce0; }
      .filler { height: 900px; }
    </style>
  </head>
  <body>
    <header>
      <h1>GestureWebController</h1>
      <span class="pill" id="serverState">检测后端…</span>
      <span class="pill" id="sourceState">未启动</span>
      <span class="pill" id="modeState">—</span>
      <span class="pill" id="acctState">未登录</span>
      <a class="pill" id="acctLink" href="profile.html" style="text-decoration: none">个人中心 →</a>
    </header>

    <main>
      <section class="card">
        <h2>画面预览</h2>
        <div class="stage"><canvas id="preview"></canvas></div>
        <div class="controls">
          <button class="primary" id="btnCamera">开启摄像头</button>
          <button id="btnVideoPick">用本地视频</button>
          <button id="btnImagePick">用图片序列</button>
          <button class="danger" id="btnStop" disabled>停止</button>
          <input type="file" id="fileVideo" accept="video/*" hidden />
          <input type="file" id="fileImages" accept="image/*" multiple hidden />
        </div>
        <div class="controls" style="padding-top: 0">
          <label class="field">后端地址 <input type="text" id="endpoint" value="http://127.0.0.1:8000" /></label>
        </div>
        <div class="hint" id="hint"></div>
        <div class="stats">
          <div><b id="sFrames">0</b><span>识别帧数</span></div>
          <div><b id="sHits">0</b><span>命中帧</span></div>
          <div><b id="sTriggers">0</b><span>触发次数</span></div>
          <div><b id="sInfer">0</b><span>平均耗时 ms</span></div>
        </div>
      </section>

      <aside style="display: grid; gap: 20px">
        <section class="card">
          <h2>六种手势</h2>
          <div class="gestures" id="gestures"></div>
        </section>
        <section class="card">
          <h2>实时日志</h2>
          <div id="log"></div>
        </section>
        <section class="card">
          <h2>动作验证区（下翻页应能看到本段滚动）</h2>
          <div class="article" id="article">
            <h3>用手势翻页</h3>
            <p>比 ✌️ 向下翻一屏，比 ☝️ 向上翻一屏，比 👍 点击当前焦点元素。</p>
            <p>本段文字用来验证滚动动作——手势触发后，这里的滚动容器与整个页面都会动。</p>
            <div class="filler"></div>
            <h3>已经到底了</h3>
            <button id="confirmTarget">这是一个可点击的按钮（按 Tab 聚焦后比 👍 试试）</button>
          </div>
        </section>
      </aside>
    </main>

    <script type="module">
      import { GestureWebController, FrameSource } from '../../sdk/src/index.js';
      import { getEndpoint, getUser, getToken, setEndpoint } from '../assets/auth.js';

      const $ = (id) => document.getElementById(id);
      const canvas = $('preview');
      const logEl = $('log');

      let ctrl = null;
      let currentKind = '';

      // ---------- 日志 ----------
      function log(message, kind = '') {
        const row = document.createElement('div');
        const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        row.innerHTML = `<span class="t">${time}</span><span class="${kind}"></span>`;
        row.lastChild.textContent = message;
        logEl.appendChild(row);
        while (logEl.children.length > 200) logEl.firstChild.remove();
        logEl.scrollTop = logEl.scrollHeight;
      }

      // ---------- 手势列表 ----------
      const GESTURES = [
        ['✌️', 'V 手势', 'peace', '下翻页', 'victory'],
        ['☝️', '食指上指', 'point', '上翻页', 'point_up'],
        ['🖐️', '张开手掌', 'palm', '截屏', 'open_palm'],
        ['👍', '点赞', 'like', '确定', 'thumb_up'],
        ['🤞', '交叉手指', 'xsign', '触发图片识别', 'cross_fingers'],
        ['🤟', '爱与和平', 'rock', '截屏 + AI 搜索', 'love_you'],
      ];
      const gestureRows = new Map();
      for (const [emoji, name, cls, act, id] of GESTURES) {
        const row = document.createElement('div');
        row.className = 'gesture';
        row.innerHTML = `<div class="emoji">${emoji}</div>
          <div><div class="name">${name}</div><div class="meta">模型类别 ${cls}</div></div>
          <div class="act">${act}</div>`;
        $('gestures').appendChild(row);
        gestureRows.set(id, row);
      }

      function highlight(id) {
        for (const [key, row] of gestureRows) row.classList.toggle('active', key === id);
        if (id) setTimeout(() => gestureRows.get(id)?.classList.remove('active'), 900);
      }

      // ---------- 后端状态 ----------
      async function probeServer() {
        const endpoint = $('endpoint').value.replace(/\/+$/, '');
        try {
          const res = await fetch(`${endpoint}/api/health`, { signal: AbortSignal.timeout(3000) });
          const data = await res.json();
          $('serverState').textContent = data.model_loaded ? '后端就绪（已加载模型）' : '后端就绪（模型待加载）';
          $('serverState').className = 'pill ok';
          log(`后端 ${endpoint} 就绪：${data.model} / ${data.classes ?? '—'} 类 / imgsz ${data.imgsz}`);
        } catch (err) {
          $('serverState').textContent = '后端未连接';
          $('serverState').className = 'pill err';
          log(`连不上后端 ${endpoint}：${err.message}`, 'err');
        }
      }
      probeServer();

      // ---------- 账号状态 ----------
      function refreshAccount() {
        const user = getUser();
        const pill = $('acctState');
        if (user && getToken()) {
          pill.textContent = `${user.nickname || user.username}${user.role === 'admin' ? '（管理员）' : ''}`;
          pill.className = 'pill ok';
          $('acctLink').textContent = '个人中心 →';
        } else {
          pill.textContent = '未登录（记录以游客身份入库）';
          pill.className = 'pill';
          $('acctLink').textContent = '登录 / 注册 →';
        }
      }
      refreshAccount();

      // ---------- 控制器 ----------
      function buildController() {
        if (ctrl) ctrl.stop();
        ctrl = new GestureWebController({
          canvas,
          endpoint: $('endpoint').value,
          fps: 8,
          mirror: currentKind === 'camera',
          token: () => getToken(),
        });

        ctrl.on('frame', ({ gestures, inferMs, streak, triggered }) => {
          if (gestures.length) {
            const top = gestures[0];
            log(`识别 ${top.label} ${(top.conf * 100).toFixed(0)}%  ${inferMs.toFixed(0)}ms  连续 ${streak.streak}/${streak.frame}`, triggered ? 'fire' : 'hit');
            highlight(top.id);
          }
          $('sFrames').textContent = ctrl.stats.frames;
          $('sHits').textContent = ctrl.stats.hits;
          $('sInfer').textContent = ctrl.stats.avgInferMs.toFixed(0);
        });

        ctrl.on('gestureTrigger', ({ gesture }) => {
          $('sTriggers').textContent = ctrl.stats.triggers;
          log(`✅ 触发 ${gesture.label} → ${gesture.action_label}`, 'fire');
        });

        ctrl.on('action', ({ label, ok, message }) => {
          log(`动作「${label}」${ok ? '完成' : '未执行'}：${message}`, ok ? '' : 'err');
        });

        ctrl.on('error', ({ message }) => log(`错误：${message}`, 'err'));

        ctrl.on('report', ({ ok, gesture, data, error }) => {
          if (ok) {
            log(`已入库：${gesture} #${data?.record?.record_id ?? '?'}`, 'hit');
          } else {
            // 上报失败不是致命问题：手势动作照常执行，只是这条没进数据库
            log(`记录未入库（不影响操控）：${error || data?.reason || '未知原因'}`, 'err');
          }
        });

        ctrl.on('config', ({ debounce }) => {
          log(`防抖参数已同步：${debounce.frame} 帧 / 阈值 ${debounce.confThreshold} / 冷却 ${debounce.cooldownMs}ms`);
        });

        return ctrl;
      }

      function setRunning(kind, label) {
        currentKind = kind;
        $('sourceState').textContent = '运行中';
        $('sourceState').className = 'pill ok';
        $('modeState').textContent = label;
        $('btnStop').disabled = false;
        for (const id of ['btnCamera', 'btnVideoPick', 'btnImagePick']) $(id).disabled = true;
      }

      function setIdle(message = '未启动') {
        $('sourceState').textContent = message;
        $('sourceState').className = 'pill';
        $('btnStop').disabled = true;
        for (const id of ['btnCamera', 'btnVideoPick', 'btnImagePick']) $(id).disabled = false;
      }

      function showHint(text) {
        $('hint').textContent = text || '';
      }

      // ---------- 三种启动方式 ----------
      $('btnCamera').addEventListener('click', async () => {
        showHint('');
        try {
          const source = await FrameSource.camera();
          buildController().start({ source });
          setRunning('camera', '摄像头');
          log('摄像头已开启，开始抽帧识别');
        } catch (err) {
          showHint(`摄像头打不开：${err.message}。没有摄像头时可用「用图片序列」模式验证整条链路。`);
          log(`摄像头启动失败：${err.message}`, 'err');
        }
      });

      $('btnVideoPick').addEventListener('click', () => $('fileVideo').click());
      $('fileVideo').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const source = await FrameSource.videoFile(file);
          buildController().start({ source });
          setRunning('video', `视频：${file.name}`);
          log(`已加载视频 ${file.name}，循环播放作为帧源`);
        } catch (err) {
          showHint(`视频加载失败：${err.message}`);
        }
        e.target.value = '';
      });

      $('btnImagePick').addEventListener('click', () => $('fileImages').click());
      $('fileImages').addEventListener('change', async (e) => {
        const files = e.target.files;
        if (!files?.length) return;
        try {
          const source = await FrameSource.images(files, { holdMs: 1500 });
          buildController().start({ source });
          setRunning('images', `图片序列：${files.length} 张`);
          log(`已加载 ${files.length} 张图片，每张停留 1.5s 用于攒够防抖帧数`);
        } catch (err) {
          showHint(`图片加载失败：${err.message}`);
        }
        e.target.value = '';
      });

      $('btnStop').addEventListener('click', () => {
        ctrl?.stop();
        setIdle('已停止');
        $('modeState').textContent = '—';
        showHint('');
        log('已停止');
      });

      $('endpoint').addEventListener('change', () => {
        setEndpoint($('endpoint').value);
        probeServer();
      });

      setIdle();
      $('endpoint').value = getEndpoint();
      canvas.width = 640;
      canvas.height = 480;
      window.addEventListener('focus', refreshAccount); // 从个人中心返回时刷新登录态
      log('页面就绪：本机没有摄像头时，选「用图片序列」也能验证识别 → 防抖 → 动作全链路');
    </script>
  </body>
</html>
