# 应用运行配置（数据库 / 鉴权 / 记录策略）
#
# 环境变量可覆盖同名配置，优先级：环境变量 > 本文件 > 代码默认值
#   GWC_DB_URL        数据库地址
#   GWC_DB_ENABLED    1/0，是否启用数据库（关闭后手势操控照常，只是不记日志）
#   GWC_JWT_SECRET    JWT 签名密钥
#   GWC_ADMIN_USER    启动时自动创建的管理员账号（同名已存在则跳过）
#   GWC_ADMIN_PASSWORD

database:
  # 相对仓库根目录；SQLite 单文件，零安装，符合"可插拔日志层"定位（ADR-006）
  url: sqlite:///data/app.db
  echo: false
  enabled: true
  # 启动时自动建表；生产环境应改为迁移脚本
  create_tables: true

auth:
  # 留空则首次启动自动生成随机密钥并写入 data/.jwt_secret（该文件不入库）
  # 多机部署必须显式设置 GWC_JWT_SECRET，否则各机签发的 token 互不认
  secret: ""
  algorithm: HS256
  expire_hours: 168          # 7 天，演示期足够；生产应更短并配刷新令牌
  min_password_length: 6
  allow_register: true

records:
  # 手势记录里的图片一律不入库（只有类型、置信度、耗时），节省体积
  enabled: true
  # 单用户保留条数上限，超过后最早记录在写入时被清理（0 = 不限制）
  max_per_user: 0

upload:
  # 图片识别（M3）把图片落盘，库里只存相对路径；前端通过 /media/uploads/... 访问
  # 关闭后识别照常返回结果，只是 img_path 为空、无法回看原图
  enabled: true
  # 相对仓库根目录；该目录不在 data 根下直接暴露，必须走 /media 挂载（ADR-014）
  dir: data/uploads
  # 长边超过此值时等比缩小再存，避免手机原图把磁盘吃满
  max_side: 1280
  jpeg_quality: 82
  # 图片识别单张上限，比视频帧的 4MB 宽（手机原图通常 3~6MB）
  max_bytes: 8388608
  # 自动清理多少天前的旧图（0 = 不清理）；启动时执行一次
  keep_days: 0

llm:
  # 问答能力（M3-5）
  #   mock   —— 离线规则回答：不联网、不花钱，答辩现场断网也能演示（默认）
  #   openai —— 任何 OpenAI 兼容接口（OpenAI / DeepSeek / 通义 / 本地 Ollama 都能用这套协议）
  provider: mock
  base_url: https://api.openai.com/v1
  # 强烈建议用环境变量 GWC_LLM_API_KEY，不要提交到仓库
  api_key: ""
  model: gpt-4o-mini
  timeout: 60
  # 送入模型的最近几轮对话（含本轮），越多越贵
  history: 4
